name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# 既定では読み取り専用。書き込みが必要なRelease更新はrelease jobのみで個別に付与する。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # mainへのpush時のみ、buildで作ったAPKをartifact経由で受け取りlatest-debugリリースを更新する。
  # ビルドスクリプトは実行せず、書き込み権限(contents: write)はこのjobにだけ付与する。
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 連続マージでビルドの完了順が前後した場合や古い実行の再実行で、古いAPKが新しいものを
      # 上書きしないよう、公開済みのビルド番号以下なら更新しない。
      # (concurrencyグループは待機中のjobを後から来たjobで置き換えるため、新しい方が
      # 取り消され得るので使わない)
      - name: Check published build number
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          body=$(gh release view latest-debug --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
          published=$(printf '%s\n' "$body" | sed -n 's/^ビルド番号: *\([0-9][0-9]*\).*/\1/p' | head -n 1)
          published=${published:-0}
          echo "published=$published current=$BUILD_NUMBER"
          if [ "$published" -ge "$BUILD_NUMBER" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::latest-debugは既にビルド番号${published}のため更新しません"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download debug APK
        if: steps.guard.outputs.skip == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-debug
          path: apk

      - name: Update latest debug release
        if: steps.guard.outputs.skip == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest-debug
          name: "最新デバッグビルド"
          body: |
            mainブランチへのpushのたびに自動更新される最新(マージ済み)のデバッグ用APKです。
            コミット: ${{ github.sha }}
            ビルド番号: ${{ github.run_number }}
          prerelease: true
          files: apk/app-debug.apk
          fail_on_unmatched_files: true
